name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore DesktopRpaAutomation.sln

    - name: Build Solution
      run: dotnet build DesktopRpaAutomation.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test DesktopRpaAutomation.sln --configuration Release --no-build --verbosity normal
